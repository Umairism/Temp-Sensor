name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate metadata.json and main.xml
        run: |
          python3 - << 'PY'
          import json, sys, xml.dom.minidom
          md = json.load(open("package/metadata.json"))
          p = md.get("KPlugin", {})
          for key in ("Id", "Name", "Version", "License", "Category", "Description", "Icon"):
              assert p.get(key), f"KPlugin.{key} missing/empty"
          assert md.get("KPackageStructure") == "Plasma/Applet"
          assert md.get("X-Plasma-API-Minimum-Version") == "6.0"
          assert p["Id"] == "com.github.umairism.thermalmonitor", "plugin id changed unintentionally"
          xml.dom.minidom.parse("package/contents/config/main.xml")
          print("metadata.json + main.xml OK")
          PY

      - name: Shell syntax + shellcheck
        run: |
          bash -n install.sh scripts/build-plasmoid.sh
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh scripts/build-plasmoid.sh

      - name: Sanity-check QML (balanced braces/parens)
        run: |
          python3 - << 'PY'
          from pathlib import Path
          for qml in Path("package").rglob("*.qml"):
              s = qml.read_text(encoding="utf-8")
              assert s.count("{") == s.count("}"), f"{qml}: unbalanced braces"
              assert s.count("(") == s.count(")"), f"{qml}: unbalanced parens"
              assert s.count("[") == s.count("]"), f"{qml}: unbalanced brackets"
              print("OK", qml)
          PY

  package:
    name: Build .plasmoid
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: scripts/build-plasmoid.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasmoid
          path: dist/*.plasmoid
